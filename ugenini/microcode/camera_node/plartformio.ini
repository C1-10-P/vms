; firmware/nodes/camera_node/platformio.ini
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Libraries
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
    tzapu/WiFiManager@^2.0
    me-no-dev/ESPAsyncWebServer@^1.2
    bblanchon/ArduinoStreamUtils@^1.6
    adafruit/Adafruit Unified Sensor@^1.1
    adafruit/DHT sensor library@^1.4

; Upload settings
upload_port = /dev/ttyUSB0
upload_speed = 921600

; For OTA updates
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = 192.168.1.100
upload_flags =
    --auth=admin
    --port=3232